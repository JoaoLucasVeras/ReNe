[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rene-v2x"
version = "0.1.0"
description = "Learned post-acceptance agreement management for V2X cooperative merging"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "gymnasium>=1.0,<2",
  "highway-env>=1.10,<2",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "pyyaml>=6,<7",
  "scipy>=1.12,<2",
  "seaborn>=0.13,<1",
  "stable-baselines3>=2.4,<3",
  "statsmodels>=0.14,<1",
  "tensorboard>=2.16,<3",
  "torch>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
