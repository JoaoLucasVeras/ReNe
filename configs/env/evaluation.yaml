environment:
  duration_s: 20.0
  dt_s: 0.2
  decision_interval_s: 1.0
  min_gap_m: 12.0
  min_ttc_s: 2.0
  min_headway_s: 0.8
  invalidation_persistence_s: 0.6
  oracle_horizon_s: 3.0

grid:
  traffic_density: [low, medium, high]
  delay_ms: [0, 100, 300, 500]
  packet_loss: [0.0, 0.05, 0.10, 0.20]
  disturbance: [none, cut_in, braking, intent_mismatch]
